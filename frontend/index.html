<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriSense | Know What Fertilizer to Use</title>
    <meta name="description" content="AI-powered precision fertilizer recommendations from soil health, crop type, and weather patterns — cutting waste and protecting soil for sustainable agriculture." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  </head>
  <body>
    <!-- Google Translate Persisted Node -->
    <div id="google_translate_wrapper" class="hidden">
      <div id="google_translate_element"></div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Prevent Google Translate from translating Material Icons into broken text strings
      const observer = new MutationObserver(() => {
        document.querySelectorAll('.material-symbols-outlined').forEach(icon => {
          icon.classList.add('notranslate');
        });
      });
      observer.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
